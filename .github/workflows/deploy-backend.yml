name: Deploy Backend to AWS
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: SSH into EC2 and Update
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/playlink-be
            
            # 1. Sync code with GitHub
            git fetch --all
            git reset --hard origin/main
            
            # 2. Install dependencies
            npm install --production
            
            # 3. Smart Restart
            # This tries to restart by name; if it fails, it starts by filename.
            # --update-env is CRITICAL to load your Stripe keys from the .env file.
            sudo -u ubuntu pm2 restart playlink-be --update-env || sudo -u ubuntu pm2 start server.js --name "playlink-be" --update-env
            
            # 4. Save the PM2 state
            sudo -u ubuntu pm2 save